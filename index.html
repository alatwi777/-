<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- ========== إعدادات خاصة لأيقونة تطبيق iPhone ========== -->
    <!-- هذا السطر هو المسؤول عن تغيير الصورة -->
    <link rel="apple-touch-icon" href="https://thumbnail.imgbin.com/15/1/14/imgbin-coffee-cup-tea-cafe-brown-coffee-brown-teacup-hGm4KYduKKjZxHsYhTNh8TyVG_t.jpg">
    
    <!-- هذا الأمر يجعل الموقع يفتح كتطبيق مستقل (بدون شريط Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- يتحكم في لون شريط الحالة (أعلى الشاشة) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- عنوان يظهر تحت الأيقونة (اختياري) -->
    <meta name="apple-mobile-web-app-title" content="بوفية شقف">
    <!-- ======================================================= -->
    
    <title>بوفية شقف تبوك</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            padding: 15px;
            background-color: #f5f5f5;
            margin: 0;
            min-height: 100vh;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
            background-color: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        
        .header-image {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            display: block;
        }
        
        .input-group {
            display: flex;
            margin-bottom: 15px;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .input-group select {
            flex: 1;
            min-width: 100px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            background-color: white;
        }
        
        .input-group button {
            flex: 0.5;
            min-width: 70px;
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        
        .remaining-group {
            flex: 1;
            min-width: 120px;
        }
        
        .remaining-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            background-color: #f8f9fa;
        }
        
        .remaining-group input:focus {
            outline: none;
            border-color: #3498db;
        }
        
        #addButton:hover {
            background-color: #2980b9;
        }
        
        .table-wrapper {
            overflow-x: auto;
            margin-top: 15px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        th, td {
            border: 1px solid #ddd;
            padding: 10px 5px;
            text-align: center;
        }
        
        th {
            background-color: #f2f2f2;
            font-weight: bold;
            font-size: 13px;
        }
        
        td {
            word-break: break-word;
        }
        
        .total {
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 8px;
            text-align: center;
        }
        
        .remaining-total {
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
            padding: 10px;
            background-color: #e8f4fd;
            border-radius: 8px;
            text-align: center;
            color: #2c3e50;
        }
        
        .delete-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.3s;
        }
        
        .delete-btn:hover {
            background-color: #c0392b;
        }
        
        .other-select {
            padding: 5px;
            border-radius: 6px;
            border: 1px solid #ddd;
            width: 55px;
            font-size: 12px;
        }
        
        /* تحسينات للايفون في الوضع الرأسي */
        @media screen and (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 12px;
            }
            
            h1 {
                font-size: 1.3rem;
                margin-bottom: 10px;
            }
            
            .header-image {
                max-height: 120px;
            }
            
            .input-group {
                gap: 6px;
            }
            
            .input-group select,
            .remaining-group input,
            .input-group button {
                font-size: 14px;
                padding: 10px 8px;
            }
            
            th {
                font-size: 11px;
                padding: 8px 3px;
            }
            
            td {
                font-size: 11px;
                padding: 8px 3px;
            }
            
            .other-select {
                width: 50px;
                font-size: 11px;
                padding: 4px;
            }
            
            .delete-btn {
                padding: 5px 8px;
                font-size: 10px;
            }
            
            .total, .remaining-total {
                font-size: 14px;
                padding: 8px;
            }
        }
        
        /* تحسينات للشاشات الصغيرة جداً */
        @media screen and (max-width: 480px) {
            th, td {
                padding: 6px 2px;
            }
            
            th {
                font-size: 10px;
            }
            
            td {
                font-size: 10px;
            }
            
            .other-select {
                width: 45px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>بوفية شقف تبوك</h1>
        <img src="https://png.pngtree.com/background/20230410/original/pngtree-milk-tea-strawberry-blueberry-delicious-background-picture-image_2384403.jpg" alt="خلفية مشروبات" class="header-image">
        
        <div class="input-group">
            <select id="cupInput">
                <option value="0">0 كوب</option>
                <option value="1">1 كوب</option>
                <option value="2">2 كوب</option>
                <option value="3">3 كوب</option>
                <option value="4">4 كوب</option>
                <option value="5">5 كوب</option>
                <option value="6">6 كوب</option>
                <option value="7">7 كوب</option>
                <option value="8">8 كوب</option>
                <option value="9">9 كوب</option>
                <option value="10">10 كوب</option>
            </select>
            <button id="addButton">إضافة</button>
            <div class="remaining-group">
                <input type="number" id="remainingAmount" placeholder="المبلغ المتبقي" value="0" step="0.01">
            </div>
        </div>
        
        <div class="table-wrapper">
            <table id="cupsTable">
                <thead>
                    <tr>
                        <th>عدد الأكواب</th>
                        <th>التاريخ واليوم والوقت</th>
                        <th>المجموع</th>
                        <th>أخرى</th>
                        <th>حذف</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- الصفوف ستضاف هنا -->
                </tbody>
            </table>
        </div>
        
        <div class="total">المجموع الكلي: <span id="grandTotal">0</span> ريال</div>
        <div class="remaining-total">المبلغ المتبقي (ثابت): <span id="remainingTotal">0</span> ريال</div>
    </div>

    <script>
        // تحميل البيانات المحفوظة عند فتح الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            loadSavedData();
            updateGrandTotal();
            updateRemainingDisplay();
            
            // إضافة مستمع للتغيرات في حقل المبلغ المتبقي
            const remainingInput = document.getElementById('remainingAmount');
            remainingInput.addEventListener('input', function() {
                saveRemainingAmount();
                updateRemainingDisplay();
            });
        });

        // دالة لحفظ المبلغ المتبقي
        function saveRemainingAmount() {
            const remainingAmount = document.getElementById('remainingAmount').value;
            localStorage.setItem('remainingAmount', remainingAmount);
        }
        
        // دالة لتحميل المبلغ المتبقي المحفوظ
        function loadRemainingAmount() {
            const savedRemaining = localStorage.getItem('remainingAmount');
            if (savedRemaining !== null) {
                document.getElementById('remainingAmount').value = savedRemaining;
            }
        }
        
        // دالة لتحديث عرض المبلغ المتبقي (ثابت ولا يتغير)
        function updateRemainingDisplay() {
            const remainingAmount = parseFloat(document.getElementById('remainingAmount').value) || 0;
            // المبلغ المتبقي يظهر كما هو دون خصم أي شيء
            document.getElementById('remainingTotal').textContent = remainingAmount.toFixed(2);
        }

        // دالة لتحميل البيانات المحفوظة
        function loadSavedData() {
            loadRemainingAmount();
            
            const savedData = localStorage.getItem('cupsData');
            if (savedData) {
                const data = JSON.parse(savedData);
                data.forEach(item => {
                    addRowToTable(item.cups, item.dateTime, item.total, item.other, false);
                });
            }
        }

        // دالة لحفظ البيانات
        function saveData() {
            const rows = document.querySelectorAll('#tableBody tr');
            const data = [];
            
            rows.forEach(row => {
                data.push({
                    cups: row.cells[0].textContent,
                    dateTime: row.cells[1].textContent,
                    total: row.cells[2].textContent.replace(' ريال', ''),
                    other: row.cells[3].querySelector('select').value
                });
            });
            
            localStorage.setItem('cupsData', JSON.stringify(data));
        }

        // دالة للحصول على التاريخ بالصيغة المطلوبة (مثال: 10 ابريل الجمعة)
        function getFormattedDate() {
            const now = new Date();
            const day = now.getDate();
            const month = now.toLocaleDateString('ar-EG', { month: 'long' });
            const weekday = now.toLocaleDateString('ar-EG', { weekday: 'long' });
            
            return `${day} ${month} ${weekday}`;
        }

        // دالة للحصول على الوقت بالصيغة المطلوبة (مثال: 9:44 م)
        function getFormattedTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'م' : 'ص';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // الساعة 12 تصبح 12 بدلاً من 0
            
            const formattedMinutes = minutes < 10 ? '0' + minutes : minutes;
            
            return `${hours}:${formattedMinutes} ${ampm}`;
        }

        // دالة للحصول على التاريخ والوقت كاملين
        function getFormattedDateTime() {
            const date = getFormattedDate();
            const time = getFormattedTime();
            return `${date} ${time}`;
        }

        // دالة لإضافة صف جديد للجدول
        function addRowToTable(cups, dateTime, total, other = 0, shouldSave = true) {
            const tableBody = document.getElementById('tableBody');
            const newRow = tableBody.insertRow();
            
            newRow.innerHTML = `
                <td>${cups}</td>
                <td>${dateTime}</td>
                <td>${total} ريال</td>
                <td>
                    <select class="other-select" onchange="updateRowTotal(this)">
                        <option value="0" ${other == 0 ? 'selected' : ''}>0</option>
                        <option value="1" ${other == 1 ? 'selected' : ''}>1</option>
                        <option value="2" ${other == 2 ? 'selected' : ''}>2</option>
                        <option value="3" ${other == 3 ? 'selected' : ''}>3</option>
                        <option value="4" ${other == 4 ? 'selected' : ''}>4</option>
                        <option value="5" ${other == 5 ? 'selected' : ''}>5</option>
                        <option value="6" ${other == 6 ? 'selected' : ''}>6</option>
                        <option value="7" ${other == 7 ? 'selected' : ''}>7</option>
                        <option value="8" ${other == 8 ? 'selected' : ''}>8</option>
                        <option value="9" ${other == 9 ? 'selected' : ''}>9</option>
                        <option value="10" ${other == 10 ? 'selected' : ''}>10</option>
                    </select>
                </td>
                <td><button class="delete-btn" onclick="deleteRow(this)">حذف</button></td>
            `;
            
            // تحديث المجموع للصف الجديد
            updateRowTotal(newRow.cells[3].querySelector('select'));
            
            if (shouldSave) {
                saveData();
                updateGrandTotal();
                updateRemainingDisplay();
            }
        }

        // دالة لتحديث المجموع للصف عند تغيير قيمة "أخرى"
        function updateRowTotal(selectElement) {
            const row = selectElement.parentNode.parentNode;
            const cups = parseFloat(row.cells[0].textContent);
            const other = parseFloat(selectElement.value);
            const total = (cups * 1.5 + other * 1).toFixed(2);
            row.cells[2].textContent = total + ' ريال';
            
            saveData();
            updateGrandTotal();
            updateRemainingDisplay();
        }

        // دالة لحذف صف
        function deleteRow(button) {
            const row = button.parentNode.parentNode;
            row.parentNode.removeChild(row);
            saveData();
            updateGrandTotal();
            updateRemainingDisplay();
        }

        // دالة لحساب المجموع الكلي
        function updateGrandTotal() {
            const totals = document.querySelectorAll('#tableBody tr td:nth-child(3)');
            let grandTotal = 0;
            
            totals.forEach(totalCell => {
                const value = parseFloat(totalCell.textContent.replace(' ريال', ''));
                grandTotal += value;
            });
            
            document.getElementById('grandTotal').textContent = grandTotal.toFixed(2);
        }

        // حدث النقر على زر الإضافة
        document.getElementById('addButton').addEventListener('click', function() {
            const cupInput = document.getElementById('cupInput');
            const cups = cupInput.value;
            
            if (cups >= 0) {
                const dateTime = getFormattedDateTime();
                const total = (cups * 1.5).toFixed(2);
                
                addRowToTable(cups, dateTime, total);
            }
        });
    </script>
</body>
</html>
